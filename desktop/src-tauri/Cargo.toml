[package]
name = "cowbot-desktop"
version = "0.1.4"
description = "CowBot desktop application"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "cowbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tokio = { version = "1", features = ["time"] }
cowbot-agent = { path = "../../crates/cowbot-agent" }
cowbot-client = { path = "../../crates/cowbot-client" }
cowbot-core = { path = "../../crates/cowbot-core" }
cowbot-llm = { path = "../../crates/cowbot-llm" }
cowbot-service = { path = "../../crates/cowbot-service" }
cowbot-tools = { path = "../../crates/cowbot-tools" }

[dev-dependencies]
tempfile = "3"

[workspace]
