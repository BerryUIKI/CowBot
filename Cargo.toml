[workspace]
members = [
    "crates/cowbot-core",
    "crates/cowbot-bus",
    "crates/cowbot-tools",
    "crates/cowbot-llm",
    "crates/cowbot-agent",
    "crates/cowbot-store",
    "crates/cowbot-client",
    "crates/cowbot-package",
    "crates/cowbot-service",
    "crates/cowbot-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
authors = ["CowBot Contributors"]
license = "Apache-2.0"
repository = "https://github.com/BerryUIKI/CowBot"

[workspace.dependencies]
# Async & runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling & logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI & utilities
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tempfile = "3.10"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Persistence
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# Internal workspace crates
cowbot-core = { path = "crates/cowbot-core" }
cowbot-bus = { path = "crates/cowbot-bus" }
cowbot-tools = { path = "crates/cowbot-tools" }
cowbot-llm = { path = "crates/cowbot-llm" }
cowbot-agent = { path = "crates/cowbot-agent" }
cowbot-store = { path = "crates/cowbot-store" }
cowbot-client = { path = "crates/cowbot-client" }
cowbot-package = { path = "crates/cowbot-package" }
cowbot-service = { path = "crates/cowbot-service" }
